<div class="surface-ground flex align-items-center justify-content-center min-h-screen min-w-screen overflow-hidden">
    <div class="flex flex-column align-items-center justify-content-center">
        <div class="mb-5 text-900 text-4xl font-bold flex-shrink-0">🍕 Pac Pizzaria</div>
        <div style="border-radius:56px; padding:0.3rem; background: linear-gradient(180deg, var(--primary-color) 10%, rgba(33, 150, 243, 0) 30%);">
            <div class="w-full surface-card py-8 px-5 sm:px-8" style="border-radius:53px">
                <div class="text-center mb-5">
                    <div class="text-900 text-3xl font-medium mb-3">Bem-vindo!</div>
                    <span class="text-600 font-medium">Acesse o painel de gestão</span>
                </div>
                <div>
                    <label for="email1" class="block text-900 text-xl font-medium mb-2">Usuário</label>
                    <input id="email1" type="text" [(ngModel)]="username" placeholder="Digite seu usuário" pInputText class="w-full md:w-30rem mb-5" style="padding:1rem">
                    <label for="password1" class="block text-900 font-medium text-xl mb-2">Senha</label>
                    <p-password id="password1" [(ngModel)]="password" placeholder="Digite sua senha" [toggleMask]="true" styleClass="mb-3" inputStyleClass="w-full p-3 md:w-30rem"></p-password>
                    <small class="block text-red-500 mb-3" *ngIf="erro">{{erro}}</small>
                    <div class="flex align-items-center justify-content-between mb-5 gap-5">
                        <div class="flex align-items-center">
                            <p-checkbox id="rememberme1" [binary]="true" styleClass="mr-2"></p-checkbox>
                            <label for="rememberme1">Lembrar de mim</label>
                        </div>
                    </div>
                    <button pButton pRipple label="Entrar" class="w-full p-3 text-xl" (click)="entrar()"></button>
                </div>
            </div>
        </div>
    </div>
</div>
