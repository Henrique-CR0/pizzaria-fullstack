<!DOCTYPE html>
<!-- Pagina de Produtos (CRUD). Protegida por JWT. - [Equipe Pizzaria] -->
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pizzaria - Produtos</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="cartao pagina-larga">
    <header class="topo">
      <h1 class="logo-pequena">Bella <span>Pizza</span> · Produtos</h1>
      <button class="botao botao-sair botao-pequeno" id="botao-sair">Sair</button>
    </header>

    <!-- Formulario de cadastro / edicao -->
    <section class="bloco">
      <h2 class="titulo-bloco" id="titulo-form">Cadastrar produto</h2>
      <form id="form-produto" class="form-grade">
        <input type="hidden" id="produto-id" />

        <div class="campo">
          <label for="nome">Nome</label>
          <input type="text" id="nome" placeholder="Ex.: Pizza Margherita" required />
        </div>

        <div class="campo">
          <label for="categoria">Categoria</label>
          <select id="categoria" required>
            <option value="">Selecione...</option>
            <option value="Pizza">Pizza</option>
            <option value="Bebida">Bebida</option>
            <option value="Sobremesa">Sobremesa</option>
          </select>
        </div>

        <div class="campo">
          <label for="preco">Preço (R$)</label>
          <input type="number" id="preco" step="0.01" min="0" placeholder="39.90" required />
        </div>

        <div class="campo campo-largo">
          <label for="descricao">Descrição</label>
          <input type="text" id="descricao" placeholder="Molho, mussarela e manjericão" />
        </div>

        <div class="acoes-form">
          <button type="submit" class="botao botao-pequeno" id="botao-salvar">Salvar</button>
          <button type="button" class="botao botao-sair botao-pequeno" id="botao-cancelar" style="display:none">Cancelar edição</button>
        </div>
        <p class="mensagem" id="msg-produto"></p>
      </form>
    </section>

    <!-- Tabela de produtos -->
    <section class="bloco">
      <h2 class="titulo-bloco">Produtos cadastrados</h2>
      <table class="tabela">
        <thead>
          <tr>
            <th>Nome</th>
            <th>Categoria</th>
            <th>Preço</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="lista-produtos">
          <!-- preenchido via JavaScript -->
        </tbody>
      </table>
      <p class="vazio" id="aviso-vazio" style="display:none">Nenhum produto cadastrado ainda.</p>
    </section>
  </main>

  <script src="js/produtos.js"></script>
</body>
</html>
